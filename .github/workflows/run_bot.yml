name: Bot Trading ML Automation

on:
  schedule:
    # Lun-Ven UTC: 13:17, 17:41, 21:23 (tre schedule distinti)
    - cron: '17 13 * * 1-5'
    - cron: '41 17 * * 1-5'
    - cron: '23 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa le librerie pinnate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt

      - name: 4. Addestra l'Ensemble ed Esegui l'Analisi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python model_engine.py
          python main.py

      - name: 5. Salva lo Stato del Portafoglio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-update stato portafoglio [skip ci]" || exit 0
          git push
