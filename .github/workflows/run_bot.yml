name: Bot Trading ML Automation

on:
  schedule:
    # Esegue dal Lunedì al Venerdì alle 13:30, 17:00 e 21:00 UTC
    - cron: '30 13,17,21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa le librerie necessarie (Ensemble)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: 4. Addestra l'Ensemble ed Esegui l'Analisi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python model_engine.py
          python main.py

      - name: 5. Salva lo Stato del Portafoglio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-update stato portafoglio [skip ci]" || exit 0
          git push
