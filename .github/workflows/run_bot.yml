name: Bot Trading ML Automation

on:
  schedule:
    # 20:30 UTC = 22:30 Italiane
    - cron: '30 20 * * *'
  workflow_dispatch: # Permette di avviare il test manuale in qualsiasi momento

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa le librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost pandas joblib requests scikit-learn

      - name: 4. Addestra i Modelli ed Esegui l'Analisi
        run: |
          python model_engine.py
          python main.py

      - name: 5. Salva lo Stato del Portafoglio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-update stato portafoglio [skip ci]" || exit 0
          git push
