name: Portfolio ML Target Horizon Analysis

on:
  workflow_dispatch:

jobs:
  target-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run ML target horizon analysis
        run: |
          python portfolio_target_horizon_analysis.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-target-horizon-results
          path: portfolio_target_horizon_results/
          retention-days: 30
