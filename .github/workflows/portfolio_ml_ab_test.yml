name: Portfolio ML A-B Test

on:
  workflow_dispatch:

jobs:
  ml-ab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run ML ON vs ML OFF A-B test
        run: python portfolio_ml_ab_test.py

      - name: Upload A-B test results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ml-ab-test-results
          path: |
            portfolio_ml_ab_test_results/
          if-no-files-found: error
