name: Retrain ML Ensemble Model

on:
  schedule:
    # Esegue ogni Domenica a mezzanotte UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy xgboost lightgbm scikit-learn requests

      - name: Run Retraining Script
        run: python train_model.py

      - name: Commit Updated Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto-Retrain: Modelli ML e Segnali Aggiornati [skip ci]" || exit 0
          git push
