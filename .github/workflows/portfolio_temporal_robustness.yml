name: Portfolio Temporal Robustness

on:
  workflow_dispatch:

jobs:
  temporal-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run temporal robustness test
        run: python portfolio_temporal_robustness.py

      - name: Upload robustness results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-temporal-robustness-results
          path: |
            portfolio_temporal_robustness_results/
          if-no-files-found: error
