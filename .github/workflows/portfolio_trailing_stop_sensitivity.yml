name: Portfolio Trailing Stop Sensitivity

on:
  workflow_dispatch:

jobs:
  trailing-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run trailing stop sensitivity backtest
        run: python portfolio_trailing_stop_sensitivity.py

      - name: Upload sensitivity results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-trailing-stop-sensitivity-results
          path: |
            portfolio_trailing_stop_sensitivity_results/
            portfolio_trailing_stop_sensitivity_summary.csv
          if-no-files-found: error
