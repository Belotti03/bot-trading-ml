name: Portfolio Asset Selection Analysis

on:
  workflow_dispatch:

jobs:
  asset-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run asset selection analysis
        run: python portfolio_asset_selection_analysis.py

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-asset-selection-results
          path: |
            portfolio_asset_selection_results/
          if-no-files-found: error
