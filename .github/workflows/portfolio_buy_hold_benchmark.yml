name: Portfolio Buy Hold Benchmark

on:
  workflow_dispatch:

jobs:
  buy-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance xgboost lightgbm scikit-learn pandas joblib requests

      - name: Run Buy & Hold benchmark
        run: python portfolio_buy_hold_benchmark.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-buy-hold-benchmark-results
          path: |
            portfolio_buy_hold_benchmark_results/
          if-no-files-found: error
