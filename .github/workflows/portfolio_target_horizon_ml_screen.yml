name: Target Horizon ML Screen
on:
  workflow_dispatch:
jobs:
  horizon-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance
      - name: Run horizon screen
        run: python portfolio_target_horizon_ml_screen.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: target-horizon-ml-screen
          path: horizon_screen_results/
