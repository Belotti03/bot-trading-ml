name: CI guards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt

      - name: Run isolated reliability tests
        run: |
          python tests/test_data_safety_summary.py
          python tests/test_nan_guards.py
