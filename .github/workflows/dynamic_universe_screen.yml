name: Dynamic Universe Screen

on:
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run dynamic universe screen
        run: python dynamic_universe_screen.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynamic_universe_screen_results.csv dynamic_universe_latest_ranking.csv dynamic_universe_equity_k*.csv
          git diff --cached --quiet || git commit -m "Add dynamic universe screening results"
          git push
