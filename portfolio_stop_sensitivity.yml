name: Portfolio Stop Sensitivity

on:
  workflow_dispatch:

jobs:
  stop-sensitivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ATR stop sensitivity backtest
        run: python portfolio_stop_sensitivity.py

      - name: Upload sensitivity results
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-stop-sensitivity-results
          path: |
            portfolio_stop_sensitivity_results/
            portfolio_stop_sensitivity_summary.csv
          if-no-files-found: error
